name: InfraGuard AI CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax
        run: |
          python -m compileall .

      - name: Build Backend Docker Image
        run: |
          docker build -f Dockerfile.backend -t infraguard-backend .

      - name: Build Frontend Docker Image
        run: |
          docker build -f Dockerfile.frontend -t infraguard-frontend .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert Repository Owner to Lowercase
        if: github.event_name == 'push'
        id: owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Tag and Push Backend Image
        if: github.event_name == 'push'
        run: |
          docker tag infraguard-backend ghcr.io/${{ steps.owner.outputs.owner }}/infraguard-backend:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/infraguard-backend:latest

      - name: Tag and Push Frontend Image
        if: github.event_name == 'push'
        run: |
          docker tag infraguard-frontend ghcr.io/${{ steps.owner.outputs.owner }}/infraguard-frontend:latest
          docker push ghcr.io/${{ steps.owner.outputs.owner }}/infraguard-frontend:latest